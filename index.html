<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .form-group {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    li button {
        width: auto;
        padding: 3px 10px;
        font-size: 13px;
        margin-left: 10px;
        background-color: #e74c3c;
    }

    button:hover {
      background-color: #45a049;
    }

    button.clear-btn {
      background-color: #e74c3c;
      margin-top: 15px;
    }

    button.clear-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <h1>Expense Tracker</h1>

  <div class="form-group">
    <input type="text" id="expenseName" placeholder="Expense name (e.g. Coffee)">
  </div>
  <div class="form-group">
    <input type="number" id="expenseAmount" placeholder="Amount (e.g. 4.50)">
  </div>
  <button onclick="addExpense()">Add Expense</button>
    <h2 id="total">Total: $0.00</h2>
    <ul id="expenseList"></ul>
  <button class="clear-btn" onclick="clearAllData()">Clear All Data</button>

  <script>
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

function addExpense() {
  const name = document.getElementById('expenseName').value;
  const amount = parseFloat(document.getElementById('expenseAmount').value);

  expenses.push({ name, amount });

  document.getElementById('expenseName').value = '';
  document.getElementById('expenseAmount').value = '';

  renderExpenses();
}

function clearAllData() {
  if (!confirm('Clear all expense data? This cannot be undone.')) return;
  expenses = [];
  renderExpenses();
}

function renderExpenses() {
  const list = document.getElementById('expenseList');
  list.innerHTML = '';

  let total = 0;

  expenses.forEach(function(expense, index) {
    total += expense.amount;
    const li = document.createElement('li');
    
    li.textContent = expense.name + ' — $' + expense.amount.toFixed(2);
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.onclick = function() {
        expenses.splice(index, 1);
        renderExpenses();
    };
li.appendChild(deleteBtn);

    list.appendChild(li);
  });

  document.getElementById('total').textContent = 'Total: $' + total.toFixed(2);
  localStorage.setItem('expenses', JSON.stringify(expenses));
}
  renderExpenses();
  </script>

</body>
</html>
